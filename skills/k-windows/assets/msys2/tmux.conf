set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard external
set -g default-terminal "xterm-256color"
set -g terminal-overrides "*:Tc"
set -g default-shell "/usr/bin/zsh"

bind r source-file ~/.tmux.conf \; display-message "config reloaded"
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status-interval 5
set -g status-left '#[bold] #S '
set -g status-right "#(/home/ikamdem/.tmux/scripts/tmux-save.sh auto-status) %H:%M %d-%b-%y"

bind C-s run-shell "/usr/bin/bash /home/ikamdem/.tmux/scripts/tmux-save.sh save"
bind C-r run-shell "/usr/bin/bash /home/ikamdem/.tmux/scripts/tmux-save.sh restore"
