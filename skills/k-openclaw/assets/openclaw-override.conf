[Service]
# Override ExecStart to use openclaw CLI directly instead of brew's node.
# This drop-in survives `openclaw gateway install --force` regenerations.
ExecStart=
ExecStart=$HOME/.local/bin/openclaw gateway --port 18789

# Use fnm's node (v24.18.0) + npm-global for CLI tools
Environment=PATH=$HOME/.local/share/fnm/node-versions/v24.18.0/installation/bin:$HOME/.npm-global/bin:$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin
