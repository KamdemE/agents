# =============================================================================
# Global Defaults (KπX standard, 2026-08-26) — MUST stay last: ssh_config
# uses first-match-wins per parameter, so every specific Host block above
# keeps priority automatically. This block only fills the gaps.
# =============================================================================
Host * !github.com !gitlab.com
    # "Master" connection reuse — one TCP handshake per host across every
    # ssh/scp/git call. Also unlocks ad-hoc tunnels on an ALREADY-OPEN
    # session without reconnecting:
    #   ssh -O forward -R 3000:localhost:3000 <host>   # add a reverse tunnel
    #   ssh -O forward -L 9000:localhost:9000 <host>   # add a local tunnel
    #   ssh -O check <host>                             # is the master alive?
    #   ssh -O exit <host>                              # tear it down
    ControlMaster auto
    ControlPath ~/.ssh/control-%C
    ControlPersist 10m

    # Reverse route standard — every remote host you connect to gets port
    # 2222 tunneled back to YOUR machine's own sshd (localhost:22),
    # reachable from INSIDE the remote session as soon as you land:
    #   scp -P 2222 <file> <you>@localhost:~/dest
    # Requires sshd running locally on whichever machine you SSH FROM.
    RemoteForward 2222 localhost:22

    ServerAliveInterval 30
    ServerAliveCountMax 3
