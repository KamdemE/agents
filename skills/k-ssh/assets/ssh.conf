# =============================================================================
# KpihX SSH Config — Canonical Fragment (skill: k-ssh)
# =============================================================================
# This file is the SINGLE SOURCE OF TRUTH for all SSH host configurations
# across all KpihX equipment. Every machine includes this file in its local
# ~/.ssh/config. NEVER duplicate these Host blocks elsewhere — edit here.
#
# Distribution:
#   - Ubuntu workstation: Include from ~/.agents/skills/k-ssh/assets/ssh.conf
#   - Phone (Termux):     Copy via scp to ~/storage/shared/kpihx-ssh/ssh.conf
#   - PVE Debian VM:      Copy to ~/.ssh/ssh.conf
#
# Key naming convention:
#   Filename:  id_ed25519_<target-infra>   (e.g. id_ed25519_pve for PVE)
#   Comment:   <source-machine-name>       (e.g. "KpihX-Ubuntu" for keys generated on Ubuntu)
# =============================================================================


# =============================================================================
# KpihX-Labs
# =============================================================================

## Git

Host github.com
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519_github
    IdentitiesOnly yes

Host gitlab.com
    HostName gitlab.com
    User git
    IdentityFile ~/.ssh/id_ed25519_gitlab
    IdentitiesOnly yes


## PVE

### PVE host (direct LAN + Tailscale)

# Direct LAN access (pve.local on Ubuntu, 129.104.234.138 direct IP on Phone)
# Tailscale access via MagicDNS hostname kpihx-pve
# On Phone: comment "ou 10.10.10.1 ou ip_kpihx_labs_tailscale"
# Uses id_ed25519_pve key — comment "KpihX-Ubuntu"
Host pve kpihx-pve
    # Direct LAN IP (used on Phone, alternative on Ubuntu):
    # HostName 129.104.234.138
    # Direct LAN hostname (Ubuntu only):
    # HostName pve.local
    # Tailscale MagicDNS (resolved only via Tailscale DNS, never via X DNS):
    HostName kpihx-pve
    # Tailscale FQDN (alternative):
    # HostName kpihx-labs.tail2527bd.ts.net
    User kpihx
    Port 2222
    IdentityFile ~/.ssh/id_ed25519_pve
    IdentitiesOnly yes
    # Keep connection alive
    ServerAliveInterval 60
    ServerAliveCountMax 5

### PVE UI tunnels (Proxmox web UI + Docker services via port forwarding)

# Direct LAN access (pve.local on Ubuntu, 129.104.234.138 on Phone)
# Tailscale access via kpihx-pve (Ubuntu) or kpihx-labs (Phone — different hostname!)
# Uses id_ed25519_pve key when using Tailscale variant
Host pve-ui kpihx-pve-ui
    # Direct LAN hostname (Ubuntu):
    HostName pve.local
    # Tailscale (Ubuntu):
    # HostName kpihx-pve
    # Direct LAN IP (Phone):
    # HostName 129.104.234.138
    # Tailscale hostname on Phone (different from Ubuntu!):
    # HostName kpihx-labs
    # Tailscale FQDN:
    # HostName kpihx-labs.tail2527bd.ts.net
    User kpihx
    Port 2222
    IdentityFile ~/.ssh/id_ed25519_pve
    IdentitiesOnly yes
    # Tunnel for Proxmox web UI (port 8006)
    LocalForward 8006 localhost:8006
    # Tunnel for Portainer on the Docker host (port 9443)
    LocalForward 9443 10.10.10.10:9443
    # Tunnel for Traefik dashboard (optional — commented by default)
    # LocalForward 8443 10.10.10.10:443
    # Tunnel for HTTP/HTTPS apps (optional)
    # LocalForward 8080 10.10.10.10:80
    # Tunnel for AdGuard DNS admin (commented after initial setup for security)
    # LocalForward 3000 10.10.10.10:3000
    # Forward SSH agent (optional — uncomment if needed):
    # ForwardAgent yes
    # Keep connection alive
    ServerAliveInterval 60
    ServerAliveCountMax 5


### PVE Dockerhost LXC (10.10.10.10 — behind PVE proxy)

# Access via ProxyJump pve (when on direct LAN / eduroam — no Tailscale DNS)
# Access via ProxyJump kpihx-pve (when on Tailscale)
# This LXC runs Traefik, Portainer, and all Docker Compose stacks.
# Legacy aliases: "homelab" (old name — kept for backward compat),
# "kpihx-cloud" (even older dockerhost name — being phased out).
# NOTE: homelab is being replaced by kpihx-pve-debian as the primary Docker host.
# Uses id_ed25519_homelab key — comment "KpihX-Ubuntu"
Host dockerhost kpihx-dockerhost 
    # Via direct LAN proxy (pve — used from eduroam / non-Tailscale environments):
    ProxyJump pve
    # Via Tailscale proxy (kpihx-pve — used when Tailscale is active):
    # ProxyJump kpihx-pve
    HostName 10.10.10.10
    User kpihx
    IdentityFile ~/.ssh/id_ed25519_homelab
    IdentitiesOnly yes
    # ForwardAgent solves the challenge: the docker-host sends key challenges
    # back to the homelab, and the agent on the local PC handles them without
    # copying the private key to the intermediate host.
    ForwardAgent yes


### PVE Debian VM (10.10.10.101 — behind PVE proxy)

# Access via ProxyJump pve (direct LAN / eduroam — uses HostName pve)
# Access via ProxyJump kpihx-pve (Tailscale — uses HostName kpihx-pve)
# This is the new primary Docker host (migrated from dockerhost LXC).
# Config dans eduroam: use ProxyJump pve (direct LAN access).
# Uses id_ed25519_pve key — comment "KpihX-Ubuntu"
Host pve-debian kpihx-pve-debian
    # Via direct LAN proxy (pve — used from eduroam / non-Tailscale environments):
    ProxyJump pve
    # Via Tailscale proxy (kpihx-pve — used when Tailscale is active):
    # ProxyJump kpihx-pve
    HostName 10.10.10.101
    User kpihx
    IdentityFile ~/.ssh/id_ed25519_pve
    IdentitiesOnly yes
    # ForwardAgent: same rationale as dockerhost — let the local agent
    # handle key challenges without storing private keys on the VM.
    ForwardAgent yes


## Phones

### Android (Termux sshd on Tailscale)

# Samsung Galaxy S25 — Termux sshd listening on port 8022.
# Tailscale IP: 100.125.54.1 (active, relay "par").
# Connection direction: PC → Phone.
# The phone's Termux user is u0_a417 (fixed by Android app UID — cannot rename).
# Termux sshd must be running: open Termux app and run `sshd`.
# Autostart: k-phones `k_phones_sshd_autostart.sh` starts sshd when Termux opens.
# Uses id_ed25519_s25 key — comment "KpihX-Ubuntu"
Host kpihx-s25 s25
    HostName 100.125.54.1
    # Tailscale MagicDNS:
    # HostName kpihx-s25
    # Tailscale FQDN:
    # HostName kpihx-s25.tail2527bd.ts.net
    Port 8022
    User u0_a417
    IdentityFile ~/.ssh/id_ed25519_s25
    IdentitiesOnly yes
    ServerAliveInterval 60
    ServerAliveCountMax 5

