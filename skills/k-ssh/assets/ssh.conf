Host ubuntu kpihx-ubuntu
    HostName 100.82.95.70
    # HostName kpihx-ubuntu
    # HostName kpihx-ubuntu.tail2527bd.ts.net
    User kpihx
    IdentityFile ~/.ssh/id_ed25519_ubuntu
    IdentitiesOnly yes
    ServerAliveInterval 60
    ServerAliveCountMax 5


