# =============================================================================
# KpihX gpg-agent.conf — Canonical Fragment (skill: k-ssh)
# =============================================================================
# Single source of truth for gpg-agent behavior across all KpihX equipment.
# Local path: ~/.gnupg/gpg-agent.conf is a SYMLINK to this file (see
# assets/links.jsonc, entry "gpg-agent-conf", skill k-ssh).
#
# WHY THIS FILE EXISTS (found 2026-08-26, deep-pc6):
#   gpg-agent's ssh-agent emulation (the PREFERRED tty/headless SSH agent
#   strategy, see SKILL.md -> "Linux, tty/headless") imports raw OpenSSH
#   private keys on `ssh-add` and re-protects them with an INTERNAL
#   passphrase of its own choosing — separate from whatever protection (if
#   any) the original key file has. GnuPG's compiled-in default policy
#   (`min-passphrase-len 8`) then REJECTS an empty passphrase at that import
#   step with "Bad Passphrase" — even when the source ~/.ssh/id_ed25519_*
#   key file is itself completely unencrypted (cipher: none, kdf: none,
#   verified via `ssh-keygen -y -f <key> -P ""` succeeding instantly).
#   This caused `agent refused operation` on every subsequent `ssh -T`/git
#   push for a key KπX never intended to passphrase-protect.
# =============================================================================

# Allow importing/using SSH keys with an empty internal protection
# passphrase — matches the protection level (none) of KpihX's own key files.
# This does NOT weaken the original key: an unencrypted ~/.ssh/id_ed25519_*
# file was never protected by a passphrase in the first place.
min-passphrase-len 0
min-passphrase-nonalpha 0

# Explicit (compiled-in defaults made visible — see SKILL.md "Cache
# behaviour" for verification method: `gpgconf --list-options gpg-agent`).
# Sliding cache (resets on each use) + hard ceiling, sudo-timestamp-shaped.
default-cache-ttl-ssh 1800
max-cache-ttl-ssh 7200
