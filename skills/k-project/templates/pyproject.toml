[project]
name = "project-name"          # kebab-case; matches repo name
version = "0.1.0"
description = "Short one-line description."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0",
    "typer>=0.12",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
project-name = "package_name.main:app"   # adjust entry point

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "package_name"   # snake_case; decouples PyPI name from import name

[dependency-groups]
dev = ["pytest>=9.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
