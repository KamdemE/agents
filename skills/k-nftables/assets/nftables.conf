#!/usr/sbin/nft -f

# flush precedent rules
flush ruleset

# ============================================================
# MAIN TABLE — packet filtering (IPv4 + IPv6)
# Priority -10 to execute BEFORE iptables-nft chains
# (Docker, Tailscale) that stay in 'ip filter'
# ============================================================
table inet filter {
    set tailscale_nets {
        type ipv4_addr
        flags interval
        elements = { 100.64.0.0/10 }
    }

    set tailscale_nets6 {
        type ipv6_addr
        flags interval
        elements = { fd7a:115c:a1e0::/48 }
    }

    chain input {
        type filter hook input priority -10; policy drop;

        # 1. Loopback
        iifname "lo" accept

        # 1.5. Miracast P2P Interfaces (GNOME Network Displays)
        iifname "p2p-dev-*" accept
        iifname "p2p*" accept

        # 2. Established/related connections
        ct state established,related accept

        # 3. Invalid connections — drop
        ct state invalid drop

        # 4. ICMP limited
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } limit rate 5/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, time-exceeded, parameter-problem, nd-neighbor-solicit, nd-router-advert, nd-neighbor-advert } limit rate 5/second accept

        # 5. DHCP
        udp sport 67 udp dport 68 accept

        # 6. mDNS
        ip daddr 224.0.0.251 udp dport 5353 accept

        # 7. SSH — Tailscale only
        iifname "tailscale0" tcp dport 22 accept

        # 8. RDP — Tailscale only
        iifname "tailscale0" tcp dport 3389 accept

        # 9. Ollama API — Docker containers only
        ip saddr 172.16.0.0/12 tcp dport 11434 accept
        ip saddr 172.16.0.0/12 udp dport 11434 accept

        # 10. Docker Swarm management — Tailscale only
        iifname "tailscale0" tcp dport 2377 accept

        # 11. Docker Swarm gossip — Tailscale only
        iifname "tailscale0" tcp dport 7946 accept
        iifname "tailscale0" udp dport 7946 accept

        # 12. Docker VXLAN — Tailscale only
        iifname "tailscale0" udp dport 4789 accept
        iifname "tailscale0" udp dport 8472 accept
        iifname "tailscale0" udp dport 10442 accept


        # 14. Tailscale catch-all — everything else from tailnet
        iifname "tailscale0" ip saddr @tailscale_nets accept
        iifname "tailscale0" ip6 saddr @tailscale_nets6 accept

        # 15. Log + drop
        limit rate 5/minute log prefix "[NFT DROP] " drop
    }

    chain output {
        type filter hook output priority -10; policy accept;
    }

    chain forward {
        type filter hook forward priority -10; policy accept;

        # Docker and Tailscale handle their own forwarding via ip filter
        # Accept all forwarding here to avoid breaking Docker
    }
}
