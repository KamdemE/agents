# ── Safety margin for remote SSH latency (OSC absorption) ──
# Default 10ms is too tight over Tailscale/remote. 100ms absorbs
# occasional fragmented OSC responses without feeling sluggish.
set -sg escape-time 100

# Mouse support (pane focus, resize, wheel scroll — not OS text select).
set -g mouse on
set -g focus-events on

# Wheel scrolls the tmux buffer, not shell command history.
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "send-keys -M"

# Copy with mouse: PRIMARY method is Shift+drag — this bypasses tmux mouse
# reporting entirely (standard xterm/VTE convention, works in GNOME Terminal,
# Ptyxis, XFCE Terminal, etc.) and lets the TERMINAL do its own native
# selection + OS clipboard write. Zero dependency on tmux/OSC52/copy-pipe —
# confirmed 2026-08-26 as the actual reliable fix after two failed tmux-side
# attempts (see references/insights.md for the full incident history).
# Limitation: only sees the currently visible screen, not tmux's scrollback
# — for that, the copy-mode bindings below remain as a SECONDARY path
# (drag without Shift, or `y`/`Enter` in copy-mode).
# Flow: drag (no Shift) selects inside copy-mode → release copies to
# clipboard and exits copy-mode immediately (this is the original, always-
# working behavior — do not drop "-and-cancel", it causes the pane to stay
# stuck in copy-mode with the selection visually vanishing and right-click
# opening tmux's copy-mode popup menu instead of a normal paste).
set -g mode-keys vi
set -g set-clipboard on
# allow-passthrough (OSC52 nested SSH/tmux) requires tmux >= 3.3 — guarded
# so older tmux (server: 3.2a) doesn't error "invalid option" (tested live
# 2026-08-26: awk exit 1 on 3.2a = correctly skipped). Kept as the one
# legitimate cross-infra compatibility fix from this saga — harmless no-op
# where unsupported, free OSC52 bonus on terminals that do support it
# (kitty/wezterm/foot/alacritty — never GNOME Terminal/Ptyxis, see insights).
if-shell 'tmux -V | awk "{split(\$2,v,\".\"); exit !(v[1]>3 || (v[1]==3 && v[2]>=3))}"' 'set -g allow-passthrough on'
bind -T root MouseDrag1Pane copy-mode -M
bind -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard -quiet 2>/dev/null || wl-copy -n 2>/dev/null || true"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard -quiet 2>/dev/null || wl-copy -n 2>/dev/null || true"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard -quiet 2>/dev/null || wl-copy -n 2>/dev/null || true"
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
# Right-click: copy-mode (scroll/select) instead of tmux popup menu.
bind -T root MouseDown3Pane select-pane \; copy-mode

# Large scrollback buffer.
set -g history-limit 50000

# Prefix: Ctrl-a instead of Ctrl-b.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Plugin manager and persistence plugins.
# tmux-copycat REMOVED 2026-08-26 ( decision): its extend_key() mechanism
# (scripts/copycat_mode_bindings.sh) auto-wraps ANY copy-mode-vi key whose
# bound command contains the literal substring "cancel" (e.g.
# copy-pipe-and-cancel) with its own copycat_mode_quit.sh chain, re-captured
# via `tmux list-keys` on every tpm reload — this silently overwrote the
# OSC52 clipboard fix on y/Enter/MouseDragEnd1Pane every time, and compounded
# into a growing embedded snapshot across repeated `tmux source-file` calls.
# No config option exists to exclude specific keys (grep-based, not
# configurable). Lost: prefix C-f/C-g/C-u/C-d/M-h/M-i/"/" (jump-search
# file paths/git-status/URLs/digits/hashes/IPs visible in the pane) and the
# n/N next/prev-match wrapping in copy-mode — native vi "/" search + n/N
# still work via tmux's own built-in search. See k-tmux/references/insights.md.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Resurrect saves sessions, windows, panes, layouts, cwd, and pane text.
set -g @resurrect-dir '$HOME/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'full'

# Continuum: autosave + restore on first manual "tmux" after login (not systemd boot).
# @continuum-boot off — login tmux.service died in ~2s (exit-empty); ExecStop save always failed.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @continuum-boot 'off'

# Manual controls remain available:
#   Ctrl-a Ctrl-s -> save now
#   Ctrl-a Ctrl-r -> restore latest save

# Ctrl-a r -> kill current process in pane, relaunch with last shell command
bind r send-keys C-c \; run-shell "sleep 0.5" \; send-keys Up Enter

# Ctrl-a R -> reload this config live (verified free in prefix table, 2026-08-26)
bind R source-file "$HOME/.tmux.conf" \; display-message "tmux.conf reloaded"

run-shell "$HOME/.tmux/plugins/tpm/tpm"
