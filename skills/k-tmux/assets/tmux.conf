# ── Safety margin for remote SSH latency (OSC absorption) ──
# Default 10ms is too tight over Tailscale/remote. 100ms absorbs
# occasional fragmented OSC responses without feeling sluggish.
set -sg escape-time 100

# Mouse support (pane focus, resize, wheel scroll — not OS text select).
set -g mouse on
set -g focus-events on

# Wheel scrolls the tmux buffer, not shell command history.
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "send-keys -M"

# Copy with mouse: drag selects inside copy-mode (Shift+drag does NOT bypass tmux in Cursor/Zed).
# Flow: drag to select → release copies to clipboard and exits copy-mode; wheel scroll unchanged above.
set -g mode-keys vi
set -g set-clipboard on
bind -T root MouseDrag1Pane copy-mode -M
bind -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard -quiet 2>/dev/null || wl-copy -n 2>/dev/null || true"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard -quiet 2>/dev/null || wl-copy -n 2>/dev/null || true"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard -quiet 2>/dev/null || wl-copy -n 2>/dev/null || true"
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
# Right-click: copy-mode (scroll/select) instead of tmux popup menu.
bind -T root MouseDown3Pane select-pane \; copy-mode

# Large scrollback buffer.
set -g history-limit 50000

# Prefix: Ctrl-a instead of Ctrl-b.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Plugin manager and persistence plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Resurrect saves sessions, windows, panes, layouts, cwd, and pane text.
set -g @resurrect-dir '$HOME/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'full'

# Continuum: autosave + restore on first manual "tmux" after login (not systemd boot).
# @continuum-boot off — login tmux.service died in ~2s (exit-empty); ExecStop save always failed.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @continuum-boot 'off'

# Manual controls remain available:
#   Ctrl-a Ctrl-s -> save now
#   Ctrl-a Ctrl-r -> restore latest save

# Ctrl-a r -> kill current process in pane, relaunch with last shell command
bind r send-keys C-c \; run-shell "sleep 0.5" \; send-keys Up Enter

# ── Agent stateful integration (tmux-notify) ──
# Persistent panes: an agent launches long commands (sudo, builds, tests) in an
# existing or new pane and is notified when the pane RETURNS TO THE SHELL
# PROMPT (command finished). tmux detects that via `monitor-silence`: a window
# with no output for N seconds fires the `alert-silence` hook — a persistent
# pane back at the prompt is silent. Panes PERSIST (nothing is killed or
# detached; no remain-on-exit needed). The relay script appends one JSON line
# per event to /tmp/tmux-pane-done.log, which scripts/plugins/tmux/tmux-notify.js
# polls to notify the agent.
#   - `monitor-silence 2`: silence threshold in seconds (0 disables).
#   - `alert-silence` GLOBAL hook: fires when a window goes silent, relays
#     session/window/pane context to the plugin.
set-window-option -g monitor-silence 2
set-hook -g alert-silence 'run-shell "$HOME/.agents/skills/k-opencode/scripts/plugins/tmux/tmux-pane-done.sh #{session_name} #{window_index} #{window_name} #{pane_id}"'

run-shell "$HOME/.tmux/plugins/tpm/tpm"
