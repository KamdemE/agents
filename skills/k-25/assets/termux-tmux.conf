# Termux tmux — aligned with KπX Ubuntu $HOME/.tmux.conf (k-tmux / k-25)
# Deploy target: $HOME/.tmux.conf on S25 Termux

set -g mouse on

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "send-keys -M"

set -g mode-keys vi
set -g set-clipboard on
bind -T root MouseDrag1Pane copy-mode -M
bind -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "termux-clipboard-set 2>/dev/null || true"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "termux-clipboard-set 2>/dev/null || true"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "termux-clipboard-set 2>/dev/null || true"
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T root MouseDown3Pane select-pane \; copy-mode

set -g history-limit 50000

# Prefix Ctrl-a (not Ctrl-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-dir '$HOME/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'full'

# Autosave every 5 min; restore on first `tmux` after Termux/app restart
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @continuum-boot 'off'

# Ctrl-a Ctrl-s = save now | Ctrl-a Ctrl-r = restore
run-shell "$HOME/.tmux/plugins/tpm/tpm"
