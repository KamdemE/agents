[project]
name = "sui"
version = "4.0.0"
description = "Sovereign Unified Interface — Agnostic privileged command gateway"
readme = "README.md"
authors = [
    { name = "KpihX", email = "kapoivha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "rich>=13.9.4",
    "typer>=0.15.1",
    "pyyaml>=6.0.1",
    "psutil>=6.0.0",
]

[project.scripts]
sui = "sui.cli:app"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=7.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
