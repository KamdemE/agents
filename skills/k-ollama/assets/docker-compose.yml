services:
  ipex-llm:
    image: intelanalytics/ipex-llm-inference-cpp-xpu:latest
    container_name: ipex-llm
    restart: always
    privileged: true
    devices:
      - /dev/dri
    ports:
      - "11435:11434"
    volumes:
      - /home/kpihx/.ollama-ipex/models:/llm/ollama/models
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/llm/ollama/models
      - OLLAMA_NUM_PARALLEL=1
      - ZES_ENABLE_SYSMAN=1
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - SYCL_CACHE_PERSISTENT=1
    command: ["sh", "-c", "/llm/scripts/start-ollama.sh && tail -f /llm/ollama/ollama.log"]
