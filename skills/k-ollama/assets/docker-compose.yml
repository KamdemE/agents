services:
  ipex-llm:
    image: intelanalytics/ipex-llm-inference-cpp-xpu:latest
    container_name: ipex-llm
    restart: always

    # Explicit device mapping — no privileged needed on native Linux
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card1:/dev/dri/card1

    # Single standard port — matches OLLAMA_HOST in .kshrc
    ports:
      - "11434:11434"

    volumes:
      - ${HOME}/.ollama-ipex/models:/llm/ollama/models

    environment:
      # ── Intel Arc / Level Zero ──────────────────────────────
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      - ZES_ENABLE_SYSMAN=1
      - SYCL_CACHE_PERSISTENT=1
      # Immediate command lists: faster dispatch on Arc iGPU (Meteor Lake)
      # Benchmark both 0 and 1 — workload-dependent
      - SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS=1

      # ── Ollama server ───────────────────────────────────────
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/llm/ollama/models
      # Offload ALL layers to Arc GPU
      - OLLAMA_NUM_GPU=999
      # Single user: 1 parallel request avoids VRAM split
      - OLLAMA_NUM_PARALLEL=1
      # Only 1 model loaded at a time (shared RAM = shared VRAM)
      - OLLAMA_MAX_LOADED_MODELS=1
      # Workstation-safe: keep models warm briefly, but don't pin RAM forever
      - OLLAMA_KEEP_ALIVE=10m
      # Flash attention: faster for long contexts
      - OLLAMA_FLASH_ATTENTION=1

      # ── CPU thread tuning (Ultra 7 155H hybrid) ─────────────
      # 6 P-cores for CPU fallback — E-cores less efficient for inference
      - OMP_NUM_THREADS=6

      # ── Misc ────────────────────────────────────────────────
      - no_proxy=localhost,127.0.0.1

    # Workstation-safe cap — leaves headroom for desktop, editors, and swap recovery
    mem_limit: 24g
    shm_size: 8g

    command: ["sh", "-c", "/llm/scripts/start-ollama.sh && tail -f /llm/ollama/ollama.log"]

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
